name: Spring boot CI

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  check-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Grant scripts permition
        run: chmod +x ./mvnw ./.test/run-test.sh

      - name: Load .env
        run: cat .env >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          RETRIES=30
          COUNT=0
          until docker compose exec -T postgres pg_isready -U postgres; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $RETRIES ]; then
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done

      - name: Run migrations
        run: |
          for f in lab3/src/main/resources/db/migration/V*.sql; do
            echo "Applying $f..."
            docker compose exec -T postgres psql -U postgres -d postgres < "$f"
          done

      - name: Compile Spring app
        run: ./mvnw clean package -DskipTests

      - name: Run Spring app
        run: java -jar ./target/*.jar --server.port=8080 > app.log 2>&1 &

      - name: Run tests
        run: ./.test/run-test.sh || (cat app.log && exit 1)
        env:
          BASE_URL: http://localhost:8080
