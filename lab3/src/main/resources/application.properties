spring.application.name=lab3

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


jwt.secret=${JWT_SECRET:supersecretkey1234567890abcdef1234567890abcdef}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

logging.level.root=INFO
logging.level.com.example.lab3=DEBUG

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Scheduler
app.scheduler.stuck-order-interval-ms=${STUCK_ORDER_INTERVAL_MS:60000}
app.scheduler.stuck-order-threshold-hours=${STUCK_ORDER_THRESHOLD_HOURS:1}
