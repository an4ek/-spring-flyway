spring.application.name=lab3

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.profiles.active=${SPRING_PROFILES_ACTIVE:db}

jwt.secret=${JWT_SECRET:supersecretkey1234567890abcdef1234567890abcdef}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

logging.level.root=INFO
logging.level.com.example.lab3=DEBUG

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
